<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - FYAG</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sglr-login">
        <div class="login-container">
            
            <div class="login-header">
                <div class="logo">
                    <img src="images/logo.png" alt="Logo FYAG">
                </div>
                <h2>Acceso FYAG</h2>
            </div>

            <div class="form-section">
                <div id="messageContainer" class="message-container" style="display: none;">
                    <div id="messageText" class="message"></div>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="usuario">
                            <i class="fa-solid fa-user"></i> Usuario
                        </label>
                        <input type="text" id="usuario" name="usuario" autocomplete="username" required>
                        <div id="usuarioError" class="error-message" style="display:none;"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fa-solid fa-lock"></i> Contraseña
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" autocomplete="current-password" required>
                        </div>
                        <div id="contrasenaError" class="error-message" style="display:none;"></div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>Recuérdame</span>
                        </label>
                    </div>

                    <a href="pages/panel-admin.html" class="btn-login" id="btnLogin">
                        <span class="btn-text">Iniciar Sesión</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </a>

                    <div class="login-footer">
                        <a href="../index.html">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script src="../js/login-administrador.js"></script>
</body>
</html>
