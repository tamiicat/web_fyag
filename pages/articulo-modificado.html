<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inventario Registrado - FYAG</title>
        <link rel="stylesheet" href="../css/style-ver-inventario.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    <body>
        <div class="dashboard-container">
            <header class="dashboard-header">
                <div class="header-left">
                    <div class="logo">
                        <img src="../images/logo_fondo.png" alt="Logo" width="150px" height="100px">
                    </div>
                    <div class="header-titles">
                        <h2>Inventario Registrado</h2>
                        <p class="subtitle">Registro de artículos en inventario</p>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="panel-admin.html" class="btn-primary-action" id="btn-volver">
                        <span class="btn-text">Volver al menú</span>
                    </a>
                    <a href="../index.html" class="btn-logout" id="btn-logout">
                        <i class="fa-solid fa-sign-out-alt"></i>
                        <span class="btn-text">Cerrar Sesión</span>
                    </a>
                </div>
            </header>

            <main class="dashboard-content inventario-layout">
                <div class="search-filters-section">
                    <div class="search-box">
                        <input type="text" placeholder="Buscar por ID, nombre, categoría, ubicación..." id="search-input">
                        <i class="fa-solid fa-search search-icon"></i>
                    </div>
                    
                    <div class="filters-row">
                        <div class="filter-select-wrapper">
                            <select id="filter-categoria" class="filter-select">
                                <option value="">Todas las categorías</option>
                                <option value="climatizacion">Climatización</option>
                                <option value="refrigeracion">Refrigeración</option>
                            </select>
                        </div>
                        
                        <div class="filter-select-wrapper">
                            <select id="sort-by" class="filter-select">
                                <option value="">Ordenar por</option>
                                <option value="id">ID</option>
                                <option value="nombre">Nombre</option>
                                <option value="stock">Stock</option>
                            </select>
                            <i class="fa-solid fa-sliders sort-icon"></i>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="inventario-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Código de Barras</th>
                                <th>Stock Actual</th>
                                <th>Stock Crítico</th>
                                <th>Estado</th>
                                <th></th> 
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>500</td>
                                <td>Aire Acondicionado</td>
                                <td style="color: red;">3498032853435</td>
                                <td>25</td>
                                <td>10</td>
                                <td><span class="status-badge disponible">Disponible</span></td>
                                <td class="acciones-td">
                                    <div class="action-icons">
                                        <a href="modificar-inventario.html" class="icon-btn edit-icon" title="Editar"><i class="fa-regular fa-pen-to-square"></i></a>
                                        <a href="eliminar-articulo.html" class="icon-btn delete-icon" title="Eliminar"><i class="fa-regular fa-trash-can"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>501</td>
                                <td>Cámara de Maduración</td>
                                <td>29149832432780</td>
                                <td>18</td>
                                <td>5</td>
                                <td><span class="status-badge disponible">Disponible</span></td>
                                <td class="acciones-td">
                                    <div class="action-icons">
                                        <a href="modificar-inventario.html" class="icon-btn edit-icon" title="Editar"><i class="fa-regular fa-pen-to-square"></i></a>
                                        <a href="eliminar-articulo.html?id=501" class="icon-btn delete-icon" title="Eliminar"><i class="fa-regular fa-trash-can"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container">
                    <button class="pagination-next-btn" title="Siguiente">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </main>
        </div>
        <script src="../js/inventario.js"></script>
    </body>
</html>
