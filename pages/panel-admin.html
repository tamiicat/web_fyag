<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel Administrador - FYAG</title>
        <link rel="stylesheet" href="../css/style-panel.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    <body>
        <div class="dashboard-container">
            <header class="dashboard-header">
                <div class="header-left">
                    <div class="logo">
                        <img src="../images/logo_fondo.png" alt="Logo" width="150px" height="100px">
                    </div>
                    <h2>Panel Administrador</h2>
                </div>
                <a href="../index.html" class="btn-logout" id="btn-logout">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span class="btn-text">Cerrar Sesión</span>
                </a>
            </header>

            <main class="dashboard-content">
                <div class="opciones">
                    <a href="#" class="btn" id="btn-crear-cuenta">Crear Cuenta</a>
                    <a href="#" class="btn" id="btn-gest-usuarios">Gestionar Usuarios</a>
                    <a href="ver-inventario.html" class="btn" id="btn-ver-inv">Ver Inventario</a>
                    <a href="gestionar-inventario.html" class="btn" id="btn-gest-inv">Gestionar Inventario</a>
                    <a href="cardex.html" class="btn" id="btn-cardex">Cardex</a>
                    <a href="#" class="btn" id="btn-reg-merma">Registrar Merma</a>
                    <a href="#" class="btn" id="btn-ver-mermas">Ver Mermas</a>
                    <a href="#" class="btn" id="btn-solicitar">Solicitar Artículo</a>
                    <a href="#" class="btn" id="btn-diagnostico">Diagnóstico</a>
                    <a href="#" class="btn" id="btn-reportes">Reportes</a>
                    <a href="#" class="btn" id="btn-mod-despacho">Módulo de Despacho</a>
                    <a href="#" class="btn" id="btn-mod-compras">Módulo de Compras</a>
                    <a href="#" class="btn" id="btn-gest-obras">Gestión de Obras</a>
                </div>
            </main>
        </div>
        <script src="../js/login-administrador.js"></script>
    </body>
</html>
